services:
  auth-server:
    build: .
    container_name: authorization-server
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./src:/app/src
      - ./include:/app/include
      - ./libs:/app/libs
    environment:
      - TZ=Europe/Moscow
      - LOG_LEVEL=DEBUG
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_DIR=/etc/ssl/certs
    command: ./authorization_server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    tty: true
    stdin_open: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth?provider=github&login_token=healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge
    name: auth-network