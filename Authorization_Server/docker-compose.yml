version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: auth_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - auth_network

  mongodb_service:
    build: ./mongodb_service
    container_name: mongodb_service
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/auth_db
    networks:
      - auth_network

  auth_server:
    build: .
    container_name: auth_server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb_service
    volumes:
      - ./config:/app/config
    networks:
      - auth_network

networks:
  auth_network:
    driver: bridge

volumes:
  mongodb_data: