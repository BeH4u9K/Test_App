version: '3.8'

services:
  # Redis должен быть ПЕРВЫМ, так как app делит с ним сеть
  redis:
    image: redis:alpine
    container_name: vite-redis
    ports:
      - "6379:6379"  # только Redis порт
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # Основное приложение - делит сеть с Redis
  app:
    build: .
    container_name: vite-app
    # НЕ указываем ports здесь, так как сеть делится с Redis
    environment:
      - NODE_ENV=production
    network_mode: "service:redis"  # делим сеть с Redis
    depends_on:
      - redis

volumes:
  redis-data: