services:
  redis:
    image: redis:7-alpine
    container_name: telegram_redis
    ports:
      - "6379:6379"
    networks:
      - bot-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: telegram_nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker1
      - worker2
      - worker3
    networks:
      - bot-network
    restart: unless-stopped

  worker1:
    build: .
    container_name: telegram_worker1
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8001"
      # Используем host.docker.internal для доступа к хосту
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_1.py
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker2:
    build: .
    container_name: telegram_worker2
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8002"
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_2.py
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker3:
    build: .
    container_name: telegram_worker3
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8003"
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_3.py
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build: .
    container_name: telegram_bot
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - nginx
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python main.py
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  bot-network:
    driver: bridge