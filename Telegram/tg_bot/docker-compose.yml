services:
  redis:
    image: redis:7-alpine
    container_name: telegram_redis
    networks:
      - bot-network 
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: telegram_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker1
      - worker2
      - worker3
    networks:
      - bot-network
    restart: unless-stopped

  worker1:
    build: .
    container_name: telegram_worker1
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PORT=8001
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_1.py

  worker2:
    build: .
    container_name: telegram_worker2
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PORT=8002
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_2.py

  worker3:
    build: .
    container_name: telegram_worker3
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - PORT=8003
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_3.py

  bot:
    build: .
    container_name: telegram_bot
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - nginx
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python main.py

networks:
  bot-network:
    driver: bridge