services:
  redis:
    image: redis:7-alpine
    container_name: telegram_redis
    ports:
      - "6379:6379"  # Ключевое: пробрасываем Redis наружу для C++ сервера
    networks:
      - bot-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: telegram_nginx
    ports:
      - "8080:80"  # Внешний порт для доступа
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - worker1
      - worker2
      - worker3
    networks:
      - bot-network
    restart: unless-stopped

  worker1:
    build: .
    container_name: telegram_worker1
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8001"
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"  # Ключевое изменение!
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_1.py

  worker2:
    build: .
    container_name: telegram_worker2
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8002"
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_2.py

  worker3:
    build: .
    container_name: telegram_worker3
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      PORT: "8003"
      AUTH_SERVICE_URL: "http://host.docker.internal:8080"
    depends_on:
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python bot_3.py

  bot:
    build: .
    container_name: telegram_bot
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - nginx
      - redis
    networks:
      - bot-network
    restart: unless-stopped
    command: python main.py

networks:
  bot-network:
    driver: bridge